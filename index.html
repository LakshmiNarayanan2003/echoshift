<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="fUzTmE7RoeUT4rBbpOM6vTH0fBTzhzM6LwH3az5DLkI" />
    <title>EchoShift</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0a0a0f;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas {
        display: block;
        box-shadow: 0 0 50px rgba(0, 255, 255, 0.1);
      }

      .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(10, 10, 15, 0.95);
        z-index: 10;
        transition: opacity 0.3s ease;
      }

      .screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      h1 {
        font-size: 4rem;
        margin-bottom: 1rem;
        text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 60px #0ff;
        animation: glow 2s ease-in-out infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 60px #0ff;
        }
        to {
          text-shadow: 0 0 30px #f0f, 0 0 50px #f0f, 0 0 70px #f0f;
        }
      }

      .subtitle {
        font-size: 1.5rem;
        color: #888;
        margin-bottom: 2rem;
      }

      .instructions {
        font-size: 1rem;
        color: #666;
        margin-bottom: 2rem;
        text-align: center;
        line-height: 1.8;
      }

      .instructions span {
        color: #0ff;
        font-weight: bold;
      }

      button {
        padding: 1rem 3rem;
        font-size: 1.5rem;
        background: transparent;
        color: #0ff;
        border: 2px solid #0ff;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 2px;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      }

      button:hover {
        background: #0ff;
        color: #0a0a0f;
        box-shadow: 0 0 40px rgba(0, 255, 255, 0.6);
        transform: scale(1.05);
      }

      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        font-size: 1.5rem;
        z-index: 5;
        pointer-events: none;
      }

      .hud-item {
        padding: 10px 20px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid #0ff;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      }

      .hud-label {
        color: #666;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .hud-value {
        color: #0ff;
        font-weight: bold;
        text-shadow: 0 0 10px #0ff;
      }

      #game-over-score {
        font-size: 2rem;
        color: #0ff;
        margin-bottom: 1rem;
      }

      #game-over-time {
        font-size: 1.5rem;
        color: #888;
        margin-bottom: 2rem;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas"></canvas>

      <div id="hud" class="hidden">
        <div class="hud-item">
          <div class="hud-label">Score</div>
          <div class="hud-value" id="score-display">0</div>
        </div>
        <div class="hud-item">
          <div class="hud-label">Time</div>
          <div class="hud-value" id="time-display">0:00</div>
        </div>
      </div>

      <div id="start-screen" class="screen">
        <h1>EchoShift</h1>
        <p class="subtitle">Survive your past</p>
        <div class="instructions">
          <p>Move with <span>WASD</span> or <span>Arrow Keys</span></p>
          <p>Collect <span>coins</span> to score points</p>
          <p>Every 10 seconds, a <span>ghost</span> appears</p>
          <p>Ghosts replay your past movements</p>
          <p>Avoid the ghosts to survive!</p>
        </div>
        <button id="start-button">Start Game</button>
      </div>

      <div id="game-over-screen" class="screen hidden">
        <h1>Game Over</h1>
        <div id="game-over-score">Score: 0</div>
        <div id="game-over-time">Survived: 0:00</div>
        <button id="restart-button">Play Again</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
